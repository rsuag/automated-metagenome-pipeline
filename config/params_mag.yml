input: "config/samplesheet_mag.csv"
outdir: "results/mag"

# Assembly/binning strategy.
coassemble_group: true
megahit_fix_cpu_1: false

# Keep these explicit for reproducibility.
save_intermediate_files: true
save_assembly_mapped_reads: false

# Fill these if host or PhiX removal is needed.
host_fasta: null
remove_phix: true

# MAG QC/classification/annotation databases.
gtdb_db: "/path/to/GTDB/release"
cat_db: "/path/to/CAT_prepare_20210107/2021-01-07_CAT_database"
cat_taxonomy: "/path/to/CAT_prepare_20210107/2021-01-07_taxonomy"
busco_db: null

